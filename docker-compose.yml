version: '3.8'

services:
  hobbytrack:
    build: .
    container_name: hobbytrack-app
    ports:
      - "8000:8000"
    volumes:
      # SQLite database persistence
      - hobbytrack_data:/app/data
    environment:
      - ENV=production
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hobbytrack_data:
    driver: local 